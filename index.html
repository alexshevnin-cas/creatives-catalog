<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creatives Catalog — CAS.AI</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<script src="shell.js"></script>
<script>writeShell({ active: 'catalog', title: 'Creatives Catalog' });</script>

<main class="content">
    <div class="toolbar">
        <div class="lead">Browse and manage every creative across all apps. Naming, sizes and previews are assigned by the system.</div>
        <div class="toolbar-actions">
            <button class="btn btn-icon" title="Export filtered set back to Drive (renamed, new folder)" onclick="toast('Prototype: filtered set would be exported back to Google Drive into a new folder, renamed by convention')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M6 11l6 6 6-6"/><path d="M4 21h16"/></svg></button>
            <a class="btn btn-green" href="inbox.html" title="Files enter the catalog through the Inbox (Drive import)">+ Add</a>
        </div>
    </div>

    <div class="filter-card">
        <div class="filter-grid">
            <div class="f-field"><label>App</label>
                <select id="fApp" onchange="render()"><option value="">Any app</option></select>
            </div>
            <div class="f-field"><label>Type</label>
                <select id="fType" onchange="render()">
                    <option value="">Any</option>
                    <option value="Video">Video</option>
                    <option value="Banner">Banner</option>
                </select>
            </div>
            <div class="f-field"><label>Tags</label>
                <select id="fTag" onchange="render()">
                    <option value="">Any tags</option>
                    <option value="gameplay">gameplay</option>
                    <option value="UGC">UGC</option>
                    <option value="mislead">mislead</option>
                    <option value="seasonal">seasonal</option>
                    <option value="meme">meme</option>
                </select>
            </div>
            <div class="f-field"><label>Author</label>
                <select id="fAuthor" onchange="render()"><option value="">Any author</option></select>
            </div>
            <div class="f-field"><label>From</label><input type="date" id="fFrom" onchange="render()"></div>
            <div class="f-field"><label>To</label><input type="date" id="fTo" onchange="render()"></div>
            <div class="f-field f-wide"><label>Search</label>
                <span class="search-wrap"><input type="text" id="fSearch" placeholder="1C code, concept # or name" oninput="render()"></span>
            </div>
        </div>
        <div class="filter-foot">
            <button class="btn-link" onclick="resetFilters()">Reset</button>
            <button class="btn btn-blue" onclick="render()">Search</button>
        </div>
    </div>

    <div class="panel panel-scroll" id="catalog"></div>
    <div class="foot-note">Statuses live in the Inbox only (D29) &middot; Network badges are placeholders until the Networks phase &middot; Playables are visible in the Inbox but not in the catalog (D18)</div>
</main>

<script>
var DATA = null;
var NETS = ['Google', 'Mintegral', 'TikTok', 'Meta'];
var AUTHORS = ['M. Petrov', 'K. Bondar', 'D. Ivanenko', 'O. Marchenko', 'S. Kravets'];
var TAG_POOL = ['gameplay', 'UGC', null, 'meme', 'gameplay', 'mislead', null, 'UGC'];
var expanded = {};   /* gameKey -> true, gameKey|Type -> true */

fetch('data.json').then(function (r) { return r.json(); }).then(function (d) {
    DATA = d;
    /* enrich deterministically: uid, tags, author, added date */
    d.tree.forEach(function (g) {
        g.types = g.types.filter(function (t) { return t.type !== 'Playable'; });
        var gOff = parseInt(hash36(g.short_name, 2), 36) % 14;
        g.types.forEach(function (t) {
            var maxSeq = t.concepts.reduce(function (m, c) { return Math.max(m, c.seq_number); }, 0);
            t.concepts.forEach(function (c) {
                c.uid = hash36(c.concept_name, 6) + 'UA';
                c.author = AUTHORS[(c.id * 7 + c.seq_number) % AUTHORS.length];
                c.tags = [];
                if (c.seasonal_tag && c.seasonal_tag !== 'STD') c.tags.push('seasonal');
                var extra = TAG_POOL[c.id % TAG_POOL.length];
                if (extra && c.tags.indexOf(extra) < 0) c.tags.push(extra);
                c.added = daysAgo(gOff + (maxSeq - c.seq_number) * 23);
            });
        });
    });

    var selApp = document.getElementById('fApp');
    d.tree.forEach(function (g) {
        var o = document.createElement('option');
        o.value = g.short_name;
        o.textContent = g.game_name + ' · ' + g.code_1c;
        selApp.appendChild(o);
    });
    var selAuthor = document.getElementById('fAuthor');
    AUTHORS.forEach(function (a) {
        var o = document.createElement('option');
        o.value = a; o.textContent = a;
        selAuthor.appendChild(o);
    });
    /* first game open by default */
    if (d.tree.length) {
        expanded[d.tree[0].short_name] = true;
        if (d.tree[0].types.length) expanded[d.tree[0].short_name + '|' + d.tree[0].types[0].type] = true;
    }
    render();
});

function filtersActive() {
    return document.getElementById('fApp').value || document.getElementById('fType').value ||
        document.getElementById('fTag').value || document.getElementById('fAuthor').value ||
        document.getElementById('fFrom').value || document.getElementById('fTo').value ||
        document.getElementById('fSearch').value;
}

function resetFilters() {
    ['fApp', 'fType', 'fTag', 'fAuthor', 'fFrom', 'fTo', 'fSearch'].forEach(function (id) {
        document.getElementById(id).value = '';
    });
    render();
}

function setTag(tag) {
    document.getElementById('fTag').value = tag;
    render();
}

function render() {
    if (!DATA) return;
    var fApp = document.getElementById('fApp').value;
    var fType = document.getElementById('fType').value;
    var fTag = document.getElementById('fTag').value;
    var fAuthor = document.getElementById('fAuthor').value;
    var fFrom = document.getElementById('fFrom').value ? new Date(document.getElementById('fFrom').value) : null;
    var fTo = document.getElementById('fTo').value ? new Date(document.getElementById('fTo').value) : null;
    var q = document.getElementById('fSearch').value.trim().toLowerCase();
    var autoOpen = filtersActive();

    var html = '<table class="tbl"><thead><tr>' +
        '<th style="width:52px">#</th><th style="width:150px">Tags</th><th style="width:76px">Preview</th>' +
        '<th>Concept</th><th style="width:90px">Files</th><th style="width:120px">Author</th>' +
        '<th style="width:210px">Networks <span style="text-transform:none;letter-spacing:0">&middot; phase 3</span></th>' +
        '</tr></thead><tbody>';
    var anyGame = false;

    DATA.tree.forEach(function (g) {
        if (fApp && g.short_name !== fApp) return;

        var gameBody = '';
        var total = 0;

        g.types.forEach(function (t) {
            if (fType && t.type !== fType) return;
            var concepts = t.concepts.filter(function (c) {
                if (fTag && c.tags.indexOf(fTag) < 0) return false;
                if (fAuthor && c.author !== fAuthor) return false;
                if (fFrom && c.added < fFrom) return false;
                if (fTo && c.added > fTo) return false;
                if (q) {
                    var hay = (c.concept_name + ' ' + c.uid + ' ' + g.code_1c + ' ' + c.seq_number).toLowerCase();
                    if (hay.indexOf(q) < 0) return false;
                }
                return true;
            });
            if (!concepts.length) return;
            total += concepts.length;

            var tKey = g.short_name + '|' + t.type;
            var tOpen = autoOpen || expanded[tKey];
            gameBody += '<tr class="type-head" onclick="toggleKey(\'' + tKey + '\')">' +
                '<td colspan="7"><span class="chev' + (tOpen ? ' open' : '') + '">&#9654;</span>' +
                '<span class="chip chip-' + t.type.toLowerCase() + '">' + t.type + '</span>' +
                ' <span class="dim">[' + concepts.length + ']</span></td></tr>';
            if (!tOpen) return;

            concepts.forEach(function (c) {
                var fullName = c.concept_name + '_' + c.uid;
                var fr = c.renditions[0];
                var thumb = fr && fr.thumbnail_path
                    ? '<div class="thumb"><img src="thumbnails/' + fr.thumbnail_path + '" loading="lazy" alt=""></div>'
                    : '<div class="thumb thumb-empty">' + t.type[0] + '</div>';
                var tags = c.tags.map(function (tg) {
                    return '<span class="chip tag tag-' + tg + '" onclick="setTag(\'' + tg + '\')">' + tg + '</span>';
                }).join('') || '<span class="dim">&mdash;</span>';
                var nets = NETS.map(function (n) {
                    return '<span class="net-stub" title="Networks phase (Phase 3) — not in MVP 1">' + n + '</span>';
                }).join('');
                var fc = c.renditions.length;

                gameBody += '<tr>' +
                    '<td class="mono muted"><strong>' + String(c.seq_number).padStart(3, '0') + '</strong></td>' +
                    '<td>' + tags + '</td>' +
                    '<td>' + thumb + '</td>' +
                    '<td><span class="c-name">' + fullName + '</span><div class="dim small">Added ' + fmtDate(c.added) + '</div></td>' +
                    '<td>' + (fc ? '<span class="files-toggle" onclick="toggleFiles(this)">' + fc + ' file' + (fc > 1 ? 's' : '') + ' <span class="chev">&#9654;</span></span>' : '<span class="dim">&mdash;</span>') + '</td>' +
                    '<td class="muted">' + c.author + '</td>' +
                    '<td>' + nets + '</td>' +
                    '</tr>';

                if (fc) {
                    gameBody += '<tr class="rend-row" style="display:none"><td colspan="7"><div class="rend-list">';
                    c.renditions.forEach(function (r) {
                        var base = r.generated_name + '_' + c.uid;
                        var info = [];
                        if (r.width && r.height) info.push(r.width + '×' + r.height);
                        if (r.duration_sec) info.push(r.duration_sec + 's');
                        var ext = t.type === 'Video' ? '.mp4' : '.png';
                        gameBody += '<div class="rend-item"><span class="mono">' + base + '</span>' +
                            '<span class="dim small">' + info.join(' · ') + '</span>' +
                            '<span style="flex:1"></span>' +
                            '<button class="btn-link btn-sm" onclick="toast(\'Prototype: downloads as ' + base + ext + '\')">Download</button></div>';
                    });
                    gameBody += '</div></td></tr>';
                }
            });
        });

        if (!total) return;
        anyGame = true;
        var gOpen = autoOpen || expanded[g.short_name];
        html += '<tr class="game-row' + (gOpen ? ' open' : '') + '" onclick="toggleKey(\'' + g.short_name + '\')">' +
            '<td colspan="7"><span class="chev' + (gOpen ? ' open' : '') + '">&#9654;</span>' +
            esc(g.game_name) + '<span class="g-code">' + g.code_1c + '</span>' +
            '<span class="g-count">(' + total + ')</span></td></tr>';
        if (gOpen) html += gameBody;
    });

    html += '</tbody></table>';
    if (!anyGame) html = '<div class="empty-state">Nothing found. Try resetting the filters.</div>';
    document.getElementById('catalog').innerHTML = html;
}

function toggleKey(key) {
    expanded[key] = !expanded[key];
    /* opening a game also opens nothing else; closing keeps type states */
    render();
}

function toggleFiles(el) {
    event.stopPropagation();
    var tr = el.closest('tr').nextElementSibling;
    if (tr && tr.classList.contains('rend-row')) {
        var open = tr.style.display !== 'none';
        tr.style.display = open ? 'none' : '';
        el.querySelector('.chev').classList.toggle('open', !open);
    }
}
</script>
</body>
</html>
